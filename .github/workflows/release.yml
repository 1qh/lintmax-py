name: release
on:
  push:
    tags: ["v*"]
permissions:
  actions: write
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ${{ vars.RUNNER_LABEL }}
    env:
      UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
      - name: build
        run: uv build
      - name: publish
        # A step's `if` cannot read that step's own `env`, so the token is set on the job: set there, it
        # is visible here and publishes; absent, the step skips and the prune steps still run.
        if: ${{ env.UV_PUBLISH_TOKEN != '' }}
        run: uv publish
      - name: prune to a single present release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune-old-releases.sh
      - name: prune ci runs
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/prune-ci-runs.sh
